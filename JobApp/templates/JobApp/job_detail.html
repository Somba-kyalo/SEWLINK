{% if delete_confirm %}
    <div class="delete-confirmation">

        <h2>Delete Job</h2>

        <p>Are you sure you want to delete:</p>

        <h3>{{ job.title }}</h3>

        <form method="POST">
            {% csrf_token %}

            <button type="submit">
                Yes, Delete Job
            </button>

            <a href="{% url 'JobApp:job_detail' job.pk %}">
                Cancel
            </a>
        </form>

        <div class="status-box">
    <span>Status</span>
    <strong>{{ job.get_status_display }}</strong>
</div>

    </div>
{% endif %}
