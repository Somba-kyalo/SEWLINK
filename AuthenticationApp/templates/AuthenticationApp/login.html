<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SewLink</title>
</head>
<body>

    <h1>Login to SewLink</h1>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Login</button>
    </form>

    <p>Don't have an account?</p>
    <a href="{% url 'AuthenticationApp:register' %}">Create Account</a>

</body>
</html>
